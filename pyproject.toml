[project]
name = "easynamd"
version = "0.1.0"
description = "Desktop GUI for preparing VMD/psfgen systems and generating staged NAMD packages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
]
keywords = ["NAMD", "VMD", "molecular-dynamics", "CHARMM", "psfgen"]

[project.urls]
Repository = "https://github.com/zarama9514/easyNAMD"
